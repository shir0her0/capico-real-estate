server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/capico_auth}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: capico-auth-service
    expiration-minutes: 30
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:}
    last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:}
    mobile-number: ${BOOTSTRAP_ADMIN_MOBILE_NUMBER:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
